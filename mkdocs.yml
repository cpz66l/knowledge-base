site_name: GameDev 知识库
site_description: Unity 客户端开发学习笔记 - C#、C++、图形学、引擎原理、性能优化、网络编程、热更新与项目实践
site_author: CPZ66L

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 深色模式
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 浅色模式
  features:
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex
  - pymdownx.details
  - admonition
  - footnotes

plugins:
  - search

