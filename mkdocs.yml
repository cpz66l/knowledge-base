site_name: GameDev 知识库
site_description: Unity 客户端开发学习笔记 - C#、图形学、引擎原理、性能优化、网络编程、热更新与项目实践
site_author: CPZ66L

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 深色模式
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 浅色模式
  features:
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex
  - pymdownx.details
  - admonition
  - footnotes

plugins:
  - search

nav:
  - 首页: index.md
  - C#:
      - csharp/index.md
      - 面向对象编程:
          - csharp/oop/index.md
          - 值类型 vs 引用类型: csharp/oop/value-vs-reference.md
          - static 静态: csharp/oop/static.md
      - LeetCode算法:
          - csharp/leetcode/index.md
          - 哈希: csharp/leetcode/hash.md
          - 双指针: csharp/leetcode/two-pointers.md
          - 滑动窗口: csharp/leetcode/sliding-window.md
          - 子串: csharp/leetcode/substring.md
          - 数组: csharp/leetcode/array.md
          - 矩阵: csharp/leetcode/matrix.md
          - 链表: csharp/leetcode/linked-list.md
          - 二叉树: csharp/leetcode/binary-tree.md
          - 图论: csharp/leetcode/graph.md
          - 回溯: csharp/leetcode/backtracking.md
          - 二分查找: csharp/leetcode/binary-search.md
          - 栈: csharp/leetcode/stack.md
          - 堆: csharp/leetcode/heap.md
          - 贪心算法: csharp/leetcode/greedy.md
          - 动态规划: csharp/leetcode/dynamic-programming.md
          - 多维动态规划: csharp/leetcode/multi-dp.md
          - 技巧: csharp/leetcode/techniques.md
      - GC 与内存管理: csharp/gc-and-memory.md
      - async/await 异步: csharp/async-await.md
      - Unity C# 最佳实践: csharp/unity-csharp-practices.md
  - Unity:
