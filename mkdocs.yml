site_name: GameDev 知识库
site_description: Unity 客户端开发学习笔记 - C#、图形学、引擎原理、设计模式与项目复盘
site_author: CPZ66L

theme:
  name: material
  language: zh
  palette:
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 深色模式
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 浅色模式
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.arithmatex
  - pymdownx.details
  - admonition
  - footnotes

plugins:
  - search

nav:
  - 首页: index.md
  - C# 深度:
      - csharp/index.md
      - GC 与内存管理: csharp/gc-and-memory.md
      - 值类型 vs 引用类型: csharp/value-vs-reference.md
      - async/await 异步: csharp/async-await.md
      - Unity C# 最佳实践: csharp/unity-csharp-practices.md
  - Unity 引擎:
      - unity/index.md
      - 生命周期: unity/lifecycle.md
      - ScriptableObject: unity/scriptable-object.md
      - Prefab 系统: unity/prefab-system.md
      - 资源管理: unity/addressables.md
      - Editor 工具开发: unity/editor-tooling.md
  - 图形学:
      - graphics/index.md
      - 渲染管线: graphics/rendering-pipeline.md
      - Shader 基础: graphics/shader-basics.md
      - 光照与着色: graphics/lighting-and-shading.md
      - PBR 理论: graphics/pbr-theory.md
      - 阴影技术: graphics/shadow-techniques.md
  - 游戏设计模式:
      - patterns/index.md
      - 组件模式: patterns/component-pattern.md
      - 观察者模式: patterns/observer-pattern.md
      - 命令模式: patterns/command-pattern.md
      - 对象池: patterns/object-pool.md
      - 状态机: patterns/state-machine.md
  - 游戏数学:
      - math/index.md
      - 向量与矩阵: math/vector-matrix.md
      - 四元数: math/quaternion.md
      - 曲线与插值: math/spline-curves.md
  - 项目复盘:
      - projects/index.md
      - 作品集总览: projects/demo-reel.md
  - 读书笔记:
      - reading/index.md
